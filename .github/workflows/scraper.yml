name: Manual RSS Scraper

on:
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Capture run start time
      id: run_meta
      run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"

    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Node.js (for librarium)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd scraper
        pip install -r requirements.txt
        pip install python-dotenv
        npm install -g librarium

    - name: Preflight Firestore access
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      run: |
        python3 - <<'PY'
        import os
        import json
        from urllib.request import urlopen, Request
        from urllib.error import HTTPError, URLError

        key = os.environ.get("FIREBASE_API_KEY", "")
        if not key:
            raise SystemExit("FIREBASE_API_KEY is missing")

        url = "https://firestore.googleapis.com/v1/projects/miny-ven/databases/(default)/documents/articles?pageSize=1&key=" + key
        req = Request(url, headers={"User-Agent": "miny-ven-preflight/1.0"})
        try:
            with urlopen(req, timeout=20) as resp:
                payload = json.load(resp)
                print(f"Firestore preflight status: {resp.status}")
                print(f"Preflight docs count in payload: {len(payload.get('documents', []))}")
        except HTTPError as e:
            raise SystemExit(f"Firestore preflight HTTP error: {e.code}")
        except URLError as e:
            raise SystemExit(f"Firestore preflight URL error: {e.reason}")
        PY
    
    - name: Run RSS Scraper
      env:
        FIREBASE_PROJECT_ID: miny-ven
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        NVIDIA_CHAT_MODELS: stepfun-ai/step-3.5-flash,z-ai/glm5,moonshotai/kimi-k2.5,minimaxai/minimax-m2.5
        BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        SCRAPER_ARTIFACT_DIR: artifacts
        SCRAPER_RUN_STARTED_AT: ${{ steps.run_meta.outputs.started_at }}
      run: |
        cd scraper
        python3 rss_scraper.py

    - name: Verify recent summary quality
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        SCRAPER_RUN_STARTED_AT: ${{ steps.run_meta.outputs.started_at }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen

        key = os.environ.get("FIREBASE_API_KEY", "")
        if not key:
            raise SystemExit("FIREBASE_API_KEY is missing")
        started_at = os.environ.get("SCRAPER_RUN_STARTED_AT", "")
        if not started_at:
            raise SystemExit("SCRAPER_RUN_STARTED_AT is missing")

        url = (
            "https://firestore.googleapis.com/v1/projects/miny-ven/databases/"
            "(default)/documents:runQuery?key=" + key
        )
        payload = {
            "structuredQuery": {
                "from": [{"collectionId": "articles"}],
                "where": {
                    "fieldFilter": {
                        "field": {"fieldPath": "fetched_at"},
                        "op": "GREATER_THAN_OR_EQUAL",
                        "value": {"stringValue": started_at}
                    }
                },
                "orderBy": [
                    {
                        "field": {"fieldPath": "fetched_at"},
                        "direction": "DESCENDING"
                    }
                ],
                "limit": 50
            }
        }

        req = Request(
            url,
            data=json.dumps(payload).encode("utf-8"),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        rows = json.load(urlopen(req, timeout=30))
        bad = []
        checked = 0

        for row in rows:
            doc = row.get("document")
            if not doc:
                continue
            fields = doc.get("fields", {})
            title = fields.get("title", {}).get("stringValue", "(untitled)")
            summary = fields.get("summary", {}).get("stringValue", "")
            words = len(summary.split())
            checked += 1

            if (
                words != 60
                or "<" in summary
                or "&#" in summary
                or summary.lower().startswith("summary:")
            ):
                bad.append({"title": title, "words": words, "summary": summary[:180]})

        print(f"Checked summaries from this run: {checked}")
        if checked == 0:
            raise SystemExit("No new articles were saved during this run")
        if bad:
            print("Recent summary quality check failed for this run:")
            for item in bad[:10]:
                print(
                    f"- {item['title']} | words={item['words']} | "
                    f"summary={item['summary']}"
                )
            raise SystemExit(f"{len(bad)} recent summaries failed validation")
        PY

    - name: Upload scraper artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-artifacts-${{ github.run_id }}
        path: scraper/artifacts/
        if-no-files-found: warn

    - name: Verify freshness window
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from datetime import datetime, timezone, timedelta
        from urllib.request import urlopen

        key = os.environ.get("FIREBASE_API_KEY", "")
        url = "https://firestore.googleapis.com/v1/projects/miny-ven/databases/(default)/documents/articles?key=" + key + "&pageSize=200"
        payload = json.load(urlopen(url))
        docs = payload.get("documents", [])
        if not docs:
            raise SystemExit("No articles found in Firestore after scraper run")

        newest = None
        for doc in docs:
            ts = doc.get("fields", {}).get("fetched_at", {}).get("stringValue")
            if not ts:
                continue
            dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
            if dt.tzinfo is None:
                dt = dt.replace(tzinfo=timezone.utc)
            if newest is None or dt > newest:
                newest = dt

        if newest is None:
            raise SystemExit("No fetched_at timestamps present in Firestore")

        age = datetime.now(timezone.utc) - newest
        print(f"Newest fetched_at: {newest.isoformat()}")
        print(f"Age: {age}")
        if age > timedelta(hours=24):
            raise SystemExit(f"Data is stale (>24h). Latest fetched_at: {newest.isoformat()}")
        PY

    - name: Report status
      if: always()
      run: |
        echo "Scraper completed at $(date)"
        echo "Articles in database: $(curl -s 'https://firestore.googleapis.com/v1/projects/miny-ven/databases/(default)/documents/articles?key=${{ secrets.FIREBASE_API_KEY }}' | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get(\"documents\",[])))' 2>/dev/null || echo 'unknown')"
