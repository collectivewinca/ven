name: Backfill Article Images

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to backfill'
        required: true
        default: '10'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd scraper
        pip install -r requirements.txt
        pip install python-dotenv

    - name: Run image backfill
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BACKFILL_LIMIT: ${{ github.event.inputs.limit }}
      run: |
        cd scraper
        python3 backfill_images.py
